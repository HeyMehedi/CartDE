name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm audit --audit-level=high
      - run: pnpm build
      - run: pnpm wrangler deploy --dry-run --outdir dist/worker-dry-run

  e2e:
    # Browser journeys and accessibility checks against the local dev server (workerd + local D1).
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # A throwaway key for the local dev server only; never a production secret.
      - run: echo "EMDASH_ENCRYPTION_KEY=$(openssl rand -base64 32)" > .env
      - run: pnpm db:migrate
      - run: pnpm test:e2e
        env:
          E2E_START_SERVER: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
